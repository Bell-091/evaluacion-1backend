{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Proyecto Django{% endblock %}</title>
    <!-- Archivos Estáticos CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">🚀 Proyecto Django</a>
            <nav class="nav-links">
                <a href="/productos/catalogo/">📦 Productos</a>
                <a href="/usuarios/registro/">👤 Usuarios</a>
                <a href="/perfil/">📋 Perfil</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <div class="card">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 - Proyecto Django | Programación Backend</p>
    </footer>

    <!-- Archivos Estáticos JS -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
